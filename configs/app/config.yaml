app:
  name: "aloh"
  version: "1.0.0"
  env: "dev"

server:
  host: "localhost"
  port: "${SERVER_PORT}"
  handshakeTimeout: 10s
  idleTimeout: 10m
  keepAlivePeriodTimeout: 10s
  closeTimeout: 10s
  startTimeout: 10s
  certsPath: "../etc/certs"
  nextProtos: ["aloh-proto"]
  maxIncomingStreams: 100

signaling:
  secret: "${SECRET}"
  credsTTL: 24h  